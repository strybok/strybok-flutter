name: strybok
description: >-
  Flutter SDK for Strybok deep links: receives Universal Links / App Links,
  resolves them to an in-app route and payload, delivers each link once, and
  creates links to share.
version: 0.3.0
homepage: https://strybok.com
repository: https://github.com/strybok/strybok-flutter
issue_tracker: https://github.com/strybok/strybok-flutter/issues
topics:
  - deep-linking
  - universal-links
  - app-links

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  app_links: ^7.2.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
