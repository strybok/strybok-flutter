name: strybok
description: >-
  Flutter SDK for Strybok deep links: receives Universal Links / App Links,
  resolves them to an in-app route and payload, and delivers each link once.
version: 0.1.0
publish_to: none # Not published until verified on physical iOS and Android devices.

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  app_links: ^7.2.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
